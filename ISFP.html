<!DOCTYPE html>
<html>
    <head>
        <title>ISFP</title>
        <style>
             *{
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }
            body{
                 background-color: rgba(240, 248, 255, 0.793);
            }
            h1{
                background:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),url('https://cdn.thecoolist.com/wp-content/uploads/personality/types/isfp/famous-people.jpg');

                background-position: center;

                color: white;
                text-align: center;

            }
            h2{
                color: blue;
            }
            .bb {
                border-left: 5px solid blue;
                border: 1px solid none;

            }
            button a{
                text-decoration: none;
                color: white;
               
            }
            button{
                 background-color: blue;

                height: 40px;
                border-radius: 8px;
                margin-right: 20px;
                margin-top: 30px;
            }
            .btn{
                display: flex;
                justify-content: center;
                align-content: center;
            }

            
        </style>

    <body>
        <h1>ISFP: </h1>
<div class="bb"><h2 style="font-size: 20px;">Name:</h2> Adventurer </div>
