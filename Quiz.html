        <script>
            const questions = [
    { q: "How often have you felt overwhelmed in the past 2 weeks?", opts: ["Rarely", "Sometimes", "Often", "Always"], scores: [1, 2, 3, 4] },
    { q: "How would you rate your sleep quality lately?", opts: ["Good", "Average", "Poor", "Very Poor"], scores: [1, 2, 3, 4] },
    { q: "Do you feel you have people to talk to when things get hard?", opts: ["Always", "Mostly", "Rarely", "Never"], scores: [1, 2, 3, 4] },
    { q: "How often do you take time to do things for yourself?", opts: ["Daily", "Weekly", "Rarely", "Never"], scores: [1, 2, 3, 4] },
    { q: "Have you noticed major changes in your energy levels?", opts: ["No changes", "Slight drop", "Low energy", "Exhausted"], scores: [1, 2, 3, 4] },
    { q: "How easily can you focus on daily tasks?", opts: ["Very easily", "Moderate", "Difficult", "Cannot focus"], scores: [1, 2, 3, 4] },
    { q: "How often do you feel anxious or restless?", opts: ["Rarely", "Sometimes", "Often", "Constantly"], scores: [1, 2, 3, 4] },
    { q: "How is your appetite lately?", opts: ["Normal", "A bit off", "Very low", "Eating too much/little"], scores: [1, 2, 3, 4] },
    { q: "How often do you engage in physical movement or walks?", opts: ["Regularly", "Sometimes", "Rarely", "Never"], scores: [1, 2, 3, 4] },
    { q: "How do you feel about your overall mood this week?", opts: ["Positive", "Neutral", "Low", "Very Sad"], scores: [1, 2, 3, 4] }
];

let currentIdx = 0;
let totalScore = 0;

const qEl = document.getElementById("question");
const optsEl = document.getElementById("options-list");
const nextBtn = document.getElementById("next-btn");
const quizBox = document.getElementById("quiz-box");
const resultBox = document.getElementById("result-box");

function loadQuestion() {
    resetState();
    let current = questions[currentIdx];
    qEl.innerText = `Q${currentIdx + 1}: ${current.q}`;
    
    current.opts.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.classList.add("opt-btn");
        btn.addEventListener("click", () => selectAnswer(current.scores[i]));
        optsEl.appendChild(btn);
    });
}

function resetState() {
    nextBtn.style.display = "none";
    optsEl.innerHTML = "";
}

function selectAnswer(scoreValue) {
    totalScore += scoreValue;
    Array.from(optsEl.children).forEach(b => b.disabled = true);
    if (currentIdx < questions.length - 1) {
        nextBtn.style.display = "block";
    } else {
        showResult();
    }
}

nextBtn.addEventListener("click", () => {
    currentIdx++;
    loadQuestion();
});

function showResult() {
    quizBox.style.display = "none";
    nextBtn.style.display = "none";
    resultBox.style.display = "block";
    
    let feedback = "";
    if (totalScore <= 15) feedback = "Your score suggests low stress. Keep up your healthy routines!";
    else if (totalScore <= 25) feedback = "You have moderate stress. Consider taking small breaks and resting more.";
    else feedback = "You show high stress levels. Please consider reaching out to a support professional.";

    resultBox.innerHTML = `<h2>Quiz Completed</h2><p>Your total score: <strong>${totalScore}</strong></p><p>${feedback}</p>`;
}

loadQuestion();

        </script>
